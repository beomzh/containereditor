<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Container Editor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <strong data-i18n="ui.title">Container Editor</strong>
    <nav class="apps"><a href="./" aria-current="page">Dockerfile</a><a href="k8s.html">Kubernetes</a></nav>
    <select id="template"></select>
    <button id="open" data-i18n="ui.open">Open</button>
    <button id="save" data-i18n="ui.save">Save</button>
    <input id="filename" value="Dockerfile" spellcheck="false" data-i18n-label="ui.fileName">
    <button id="undo" data-i18n="ui.undo">Undo</button>
    <button id="redo" data-i18n="ui.redo">Redo</button>
    <span class="spacer"></span>
    <label><span data-i18n="ui.platform">Platform</span>
      <select id="platform">
        <option>linux/amd64</option>
        <option>linux/arm64</option>
        <option>linux/arm/v7</option>
        <option>windows/amd64</option>
        <option>windows/arm64</option>
      </select>
    </label>
    <button id="check" class="primary" data-i18n="ui.check">① Check images</button>
    <select id="language" data-i18n-label="ui.language"></select>
    <input id="file" type="file" hidden>
  </header>

  <main>
    <section id="left"></section>

    <section id="center">
      <div id="editor">
        <pre id="gutter" aria-hidden="true"></pre>
        <div id="code">
          <pre id="highlight" aria-hidden="true"></pre>
          <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" data-i18n-label="ui.content"></textarea>
        </div>
      </div>
      <div id="problems">
        <div id="summary" role="status"></div>
        <ul id="diagnostics"></ul>
      </div>
    </section>

    <section id="side">
      <nav id="tabs" role="tablist">
        <button role="tab" data-tab="preview" data-i18n="ui.tabPreview">Result</button>
        <button role="tab" data-tab="compat" data-i18n="ui.tabCompat">Compatibility</button>
        <button role="tab" data-tab="build" data-i18n="ui.tabBuild">② Build</button>
      </nav>
      <div id="preview" class="panel" role="tabpanel"></div>
      <div id="compat" class="panel" role="tabpanel" hidden></div>
      <div id="build" class="panel" role="tabpanel" hidden></div>
    </section>
  </main>

  <div id="toast" role="alert" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
